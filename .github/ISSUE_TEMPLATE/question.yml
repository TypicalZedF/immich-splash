name: Question
description: Ask how something works
title: "[Question] "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: If it matters for your question. You can find it in Settings.
      placeholder: e.g. 1.6.5
    validations:
      required: false
