name: Translation
description: Fix wrong wording, or ask for a new language
title: "[Translation] "
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Deutsch, or a language the app doesn't have yet
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change?
      description: Quote the current text, say where it appears, and suggest better wording. For a new language, tell us if you'd be happy to help translate it.
    validations:
      required: true
