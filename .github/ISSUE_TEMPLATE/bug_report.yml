name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this! Please don't include API keys, tokens, server addresses or personal info anywhere in this form.

        Found a security problem? Please [report it privately](https://github.com/TypicalZedF/immich-splash/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: Include the exact wording of any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: You can find it in Settings.
      placeholder: e.g. 1.6.5
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: How did you install the app?
      options:
        - Windows installer
        - Windows portable zip
        - Linux tarball
        - Linux Flatpak
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: e.g. Windows 11 24H2, Fedora 43
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Immich server version
      placeholder: e.g. 3.3.0
    validations:
      required: true
  - type: dropdown
    id: sign-in
    attributes:
      label: How do you sign in?
      options:
        - Email and password
        - SSO (OAuth)
        - API key
        - Not sure, or it doesn't apply
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Settings > Open logs takes you to the log folder. Paste the relevant lines here, after removing server addresses and personal info.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help. Check they don't show anything private.
    validations:
      required: false
